name: edux
description: EduX — test, CRM, kurslar va maktab tizimining mobil ilovasi (iPhone, iPad va Android).
publish_to: none
version: 3.9.1+15

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  edux_omr:
    path: packages/edux_omr
  camera: ^0.11.0+2
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  flutter_math_fork: ^0.7.2
  wakelock_plus: ^1.2.8
  open_filex: ^4.5.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  audioplayers: ^6.8.1
  mobile_scanner: ^7.0.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/brand/mark.png
  # Dizayn tizimi shriftlari (SIL OFL, assets/fonts/OFL-*.txt). 3.9 (v3 «Koshin»): Commissioner — sarlavha va raqamlar,
  # Onest — matn (veb bilan bir xil); o'zgaruvchan woff2 dan statik qalinliklar, lotin + kirill (uz/ru/en) to'plamiga
  # qisqartirilgan (APK hajmi). Qayta yig'ish: tool/fonts/build_fonts.py. Golos Text va Literata 3.9 da olib tashlandi.
  fonts:
    - family: Commissioner
      fonts:
        - asset: assets/fonts/Commissioner-400.ttf
        - asset: assets/fonts/Commissioner-600.ttf
          weight: 600
        - asset: assets/fonts/Commissioner-700.ttf
          weight: 700
        - asset: assets/fonts/Commissioner-800.ttf
          weight: 800
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-400.ttf
        - asset: assets/fonts/Onest-500.ttf
          weight: 500
        - asset: assets/fonts/Onest-600.ttf
          weight: 600
        - asset: assets/fonts/Onest-700.ttf
          weight: 700
        - asset: assets/fonts/Onest-800.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-400.ttf
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/icon.png
  adaptive_icon_background: "#1F63F5"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  remove_alpha_ios: true
