# «EduX Shlyuz» — SMS va qo'ng'iroqlar uchun alohida Android ilova (gateway/, Kotlin, Flutter'siz).
# Har push'da yig'iladi (Artifacts); main'da — «gateway-latest» relizi: edux-shlyuz.apk (server standart havolasi —
# PlatformSettings::GATEWAY_APK). Imzo: asosiy ilova bilan bir xil kalit (ANDROID_KEYSTORE_*); bo'lmasa sinov kaliti.
name: Gateway

on:
  push:
    branches: ['**', '!screenshots']
    paths: ['gateway/**', '.github/workflows/gateway.yml']
  workflow_dispatch:

concurrency:
  group: gateway-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Imzo
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > gateway/upload.jks
            printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > gateway/key.properties
          else
            echo "::notice::Imzo kaliti yo'q — APK sinov kaliti bilan imzolanadi"
          fi

      - name: APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle -p gateway assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          cp gateway/app/build/outputs/apk/release/app-release.apk edux-shlyuz.apk
          ls -la edux-shlyuz.apk

      - name: Xato tafsilotlari
        if: failure()
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -60 | while IFS= read -r line; do echo "::error::$line"; done || true

      - uses: actions/upload-artifact@v7
        with:
          name: edux-shlyuz
          path: edux-shlyuz.apk

      - name: Releases → gateway-latest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oE 'versionName = "[^"]+"' gateway/app/build.gradle.kts | cut -d'"' -f2)
          title="EduX Shlyuz $version (yig'ish ${{ github.run_number }})"
          notes="SMS va qo'ng'iroqlar uchun alohida ilova. Ulash: EduX vebida SMS sahifasi yoki Sozlamalar → Call markaz → «Ulash kodini yaratish». ${{ github.sha }}"
          if gh release view gateway-latest > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/gateway-latest" -f sha="$GITHUB_SHA" -F force=true > /dev/null \
              || echo "::warning::gateway-latest tegini surib bo'lmadi"
            gh release edit gateway-latest --title "$title" --notes "$notes"
            gh release upload gateway-latest edux-shlyuz.apk --clobber
          else
            gh release create gateway-latest edux-shlyuz.apk --target "$GITHUB_SHA" --prerelease --title "$title" --notes "$notes"
          fi
