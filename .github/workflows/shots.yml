# Real Android screenshots of every role (tool/shots/README.md).
# A fixture server (tool/shots/server.py) replays recorded responses of the demo backend; the app runs on an
# Android emulator (API 34, Pixel 6, 1080x2400) and integration_test/shots_test.dart logs in through the real
# login form as each role and visits its screens. Screenshots: artifact «mobile-screenshots».
name: Shots

on:
  push:
    branches: [shots]
  workflow_dispatch:

concurrency:
  group: shots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android-shots:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Platforma papkalari (android)
        run: |
          set -o pipefail
          flutter --version
          flutter create --org uz.edux --project-name edux --platforms=android . 2>&1 | tee -a ci.log
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then rm test/widget_test.dart; fi
          flutter pub get 2>&1 | tee -a ci.log
          dart run tool/configure_platforms.dart 2>&1 | tee -a ci.log || true
          # Fixture server is plain HTTP on the host (10.0.2.2) — allow cleartext for this debug run only.
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          grep -n "usesCleartextTraffic" android/app/src/main/AndroidManifest.xml

      - name: Tahlil (integration_test)
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings integration_test 2>&1 | tee analyze.log
          if grep -E "^\s*error •" analyze.log; then
            grep -E "^\s*error •" analyze.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Fixture server
        run: |
          mkdir -p shots
          nohup python3 -u tool/shots/server.py --host 0.0.0.0 --port 8000 --shots shots > server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          echo; head -5 server.log

      - name: Emulator + screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          cores: 3
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash tool/shots/run_on_emulator.sh

      - name: Natija
        if: always()
        run: |
          echo "== server log (misses)"; grep -E "MISS|NEAR|WRITE|FAILED" server.log | sort | uniq -c | sort -rn | head -80 || true
          echo "== test log"; grep -E "TEST|SHOT" server.log | head -400 || true
          count=$(ls shots/*.png 2>/dev/null | wc -l)
          echo "::notice::Screenshots: $count"
          for role in director admin cashier marketer teacher student guardian owner; do
            echo "$role: $(ls shots/ 2>/dev/null | grep -c -- "-$role-")"
          done
          cp server.log shots/ 2>/dev/null || true
          cp test.log shots/ 2>/dev/null || true
          [ "$count" -gt 0 ]

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-screenshots
          path: shots/
          if-no-files-found: warn

      # The same zip as a *draft* release asset (no tag, not public): reachable where Actions artifact storage is not.
      - name: Draft release (shots-<run>)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$(ls shots/*.png 2>/dev/null)" ] || exit 0
          (cd shots && zip -q -r ../mobile-screenshots.zip .)
          for tag in $(gh api repos/${{ github.repository }}/releases --paginate --jq '.[] | select(.draft and (.tag_name|startswith("shots-"))) | .tag_name'); do
            gh release delete "$tag" --yes --repo ${{ github.repository }} || true
          done
          gh release create "shots-${{ github.run_id }}" mobile-screenshots.zip --draft --target "${{ github.sha }}" \
            --title "Mobile screenshots (run ${{ github.run_id }})" --notes "Shots workflow, commit ${{ github.sha }}" --repo ${{ github.repository }}
