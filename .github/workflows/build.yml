# EduX mobil ilovasini yig'ish: tahlil, testlar, Android APK. main ga har push'dan keyin APK
# «Releases → latest» sahifasiga qo'yiladi — telefonga shu yerdan yuklab o'rnatiladi.
# iOS: alohida job (macos-latest) imzosiz `.app` yig'adi va Artifacts ga qo'yadi; u Android job'iga bog'liq emas
# va xato bersa ham Android yig'ilishi/Releases to'xtamaydi.
# Sozlamalar (repo → Settings → Secrets and variables → Actions):
#   vars.EDUX_SERVER             — ilova sukut bo'yicha ulanadigan server (bo'lmasa https://edux.kuchkarov.uz)
#   secrets.GOOGLE_SERVICES_JSON — Firebase google-services.json matni (push uchun; bo'lmasa push o'chiq)
#   secrets.ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD — Play Market imzosi (ixtiyoriy;
#     bo'lsa har yig'ishda imzolangan .aab ham chiqadi va «latest» relizga qo'shiladi)
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  EDUX_SERVER: ${{ vars.EDUX_SERVER || 'https://edux.kuchkarov.uz' }}

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Diskda joy bo'shatish
        # Runner diski to'lib qolsa NDK arxivi buzuq yuklanadi va yig'ish «No space left on device» bilan yiqiladi.
        # Bizga kerak bo'lmagan katta vositalar (.NET, Haskell, CodeQL, Swift, Boost, Docker tasvirlari) o'chiriladi.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/boost /usr/local/share/powershell /usr/local/lib/node_modules /opt/microsoft /opt/google/chrome \
            /usr/local/share/chromium /opt/az /usr/share/miniconda || true
          docker image prune -af > /dev/null 2>&1 || true
          echo "::notice::Disk: $(df -h / | tail -1 | awk '{print $4}') bo'sh"

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Platforma papkalari (android/ios)
        run: |
          set -o pipefail
          flutter --version
          flutter create --org uz.edux --project-name edux --platforms=android,ios . 2>&1 | tee -a ci.log
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then rm test/widget_test.dart; fi
          flutter pub get 2>&1 | tee -a ci.log
          dart run tool/configure_platforms.dart 2>&1 | tee -a ci.log
          dart run flutter_launcher_icons 2>&1 | tee -a ci.log

      - name: Android NDK (qayta urinish bilan)
        # Gradle NDK ni yig'ish paytida yuklaydi; Google serveridagi arxiv buzuq kelsa («ZipFile unknown archive») yig'ish
        # yiqiladi. Kerakli NDK ni oldindan 3 urinish bilan o'rnatamiz; bo'lmasa runner'da oldindan o'rnatilgan eng yangi NDK ishlatiladi.
        timeout-minutes: 15
        run: |
          GRADLE_APP=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -1)
          NDK=$(grep -rhoE 'ndkVersion[^0-9"]*"?[0-9]+\.[0-9]+\.[0-9]+' "$FLUTTER_ROOT/packages/flutter_tools/gradle" 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          echo "::notice::Flutter NDK: ${NDK:-aniqlanmadi}; o'rnatilganlar: $(ls "$ANDROID_HOME/ndk" 2>/dev/null | tr '\n' ' ')"
          if [ -n "$NDK" ] && [ -f "$ANDROID_HOME/ndk/$NDK/source.properties" ]; then exit 0; fi
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -n "$NDK" ]; then
            for i in 1 2 3; do
              yes | timeout 300 "$SDKM" "ndk;$NDK" > ndk.log 2>&1 || true
              if [ -f "$ANDROID_HOME/ndk/$NDK/source.properties" ]; then echo "::notice::NDK $NDK o'rnatildi"; exit 0; fi
              echo "::warning::NDK $NDK yuklash $i-urinishda muvaffaqiyatsiz: $(grep -iE 'error|warning' ndk.log | tail -1)"
              rm -rf "$ANDROID_HOME/ndk/$NDK"; sleep 20
            done
          fi
          LOCAL=$(ls "$ANDROID_HOME/ndk" 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          [ -n "$LOCAL" ] || { echo "::error::NDK yo'q"; exit 1; }
          sed -i -E "s/ndkVersion *= *flutter\.ndkVersion/ndkVersion = \"$LOCAL\"/; s/ndkVersion +flutter\.ndkVersion/ndkVersion \"$LOCAL\"/" "$GRADLE_APP"
          grep -n ndkVersion "$GRADLE_APP" || sed -i -E "0,/^android *\{/s//android {\n    ndkVersion = \"$LOCAL\"/" "$GRADLE_APP"
          echo "::warning::NDK $NDK yuklanmadi — runner'dagi $LOCAL ishlatiladi ($(grep -n ndkVersion "$GRADLE_APP"))"

      - name: Firebase va imzo
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON yo'q — ilova push'siz yig'iladi"
          fi
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android/app/upload.jks
            printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
            # Imzo bor — Play Market uchun .aab ham yig'iladi va relizga qo'shiladi.
            echo "SIGNED_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "::notice::Imzo kaliti yo'q — APK sinov kaliti bilan imzolanadi"
          fi
          dart run tool/configure_firebase.dart 2>&1 | tee -a ci.log
          dart run tool/configure_signing.dart 2>&1 | tee -a ci.log

      - name: Tahlil
        run: |
          status=0
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1 || status=$?
          cat analyze.log
          # Xatolar annotatsiya bo'lib chiqadi (Actions sahifasida va API orqali ko'rinadi).
          grep -E "^\s*error •" analyze.log | head -40 | while IFS= read -r line; do
            file=$(echo "$line" | sed -E 's/.* • ([^ ]+):([0-9]+):([0-9]+) • .*/\1/'); row=$(echo "$line" | sed -E 's/.* • [^ ]+:([0-9]+):[0-9]+ • .*/\1/')
            echo "::error file=$file,line=$row::$line"
          done
          grep -E "^\s*warning •" analyze.log | head -20 | while IFS= read -r line; do echo "::warning::$line"; done
          echo "::notice::Tahlil: $(grep -cE '^\s*error •' analyze.log) xato, $(grep -cE '^\s*warning •' analyze.log) ogohlantirish, $(grep -cE '^\s*info •' analyze.log) maslahat"
          exit $status

      - name: Testlar
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log

      - name: APK
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} --dart-define=EDUX_SERVER=$EDUX_SERVER 2>&1 | tee build.log

      - name: AAB (Play Market)
        # Imzo kaliti bo'lsa har yig'ishda; bo'lmasa faqat qo'lda (sinov kaliti bilan — Play qabul qilmaydi).
        if: github.event_name == 'workflow_dispatch' || env.SIGNED_RELEASE == 'true'
        run: |
          set -o pipefail
          flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=EDUX_SERVER=$EDUX_SERVER 2>&1 | tee -a build.log

      - name: Xato tafsilotlari
        if: failure()
        run: |
          for file in ci.log test.log build.log; do
            [ -f "$file" ] || continue
            grep -nE "(error|Error|ERROR|FAILED|Exception|What went wrong|Could not|Execution failed|\.dart:[0-9]+:[0-9]+)" "$file" | grep -v "^.*warning" | head -12 | while IFS= read -r line; do
              echo "::error title=$file::$(echo "$line" | cut -c1-900)"
            done
          done

      - uses: actions/upload-artifact@v7
        with:
          name: edux-android
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Releases → latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          files=(build/app/outputs/flutter-apk/*.apk)
          notes="Avtomatik yig'ish: ${{ github.sha }}. Ko'pchilik telefonlar uchun: app-arm64-v8a-release.apk. Eski telefonlar: app-armeabi-v7a-release.apk. Server: $EDUX_SERVER"
          # Imzolangan App Bundle — Google Play Console'ga yuklash uchun.
          if [ "$SIGNED_RELEASE" = "true" ] && [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab "edux-$version-${{ github.run_number }}.aab"
            files+=("edux-$version-${{ github.run_number }}.aab")
            notes="$notes. Google Play: edux-$version-${{ github.run_number }}.aab (versionCode ${{ github.run_number }})."
          fi
          title="EduX $version (yig'ish ${{ github.run_number }})"
          # Reliz o'chirilmaydi: yig'ish to'xtab qolsa ham eski fayllar joyida qoladi. Avval yangi fayllar yuklanadi,
          # so'ng yangi ro'yxatda yo'q eski fayllar (masalan oldingi .aab) o'chiriladi.
          if gh release view latest > /dev/null 2>&1; then
            # «latest» tegi joriy commit'ga suriladi (tag — CI'niki, tarix o'zgarmaydi).
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true > /dev/null \
              || echo "::warning::latest tegini surib bo'lmadi"
            gh release edit latest --prerelease --title "$title" --notes "$notes"
            gh release upload latest "${files[@]}" --clobber
            keep=" "; for f in "${files[@]}"; do keep="$keep$(basename "$f") "; done
            gh release view latest --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              case "$keep" in *" $asset "*) ;; *) echo "Eski fayl o'chiriladi: $asset"; gh release delete-asset latest "$asset" --yes ;; esac
            done
          else
            gh release create latest "${files[@]}" --target "$GITHUB_SHA" \
              --prerelease --title "$title" --notes "$notes"
          fi

  ios:
    # Imzosiz iOS yig'ish: loyiha sozlamalari, plaginlar (CocoaPods) va Dart kodi iOS da yig'ilishini tekshiradi.
    # App Store / TestFlight uchun imzo va GoogleService-Info.plist alohida (README → iPhone).
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Platforma papkasi (ios)
        run: |
          set -o pipefail
          flutter --version
          # flutter_launcher_icons android papkasini ham kutadi — shuning uchun ikkalasi yaratiladi.
          flutter create --org uz.edux --project-name edux --platforms=android,ios . 2>&1 | tee -a ci-ios.log
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then rm test/widget_test.dart; fi
          flutter pub get 2>&1 | tee -a ci-ios.log
          dart run tool/configure_platforms.dart --ios 2>&1 | tee -a ci-ios.log
          dart run flutter_launcher_icons 2>&1 | tee -a ci-ios.log

      - name: Xcode sozlamasi va CocoaPods
        run: |
          set -o pipefail
          # Podfile shu bosqichda yaratiladi — keyin minimal iOS versiyasi qayta qo'yiladi
          flutter build ios --config-only --release --no-codesign --dart-define=EDUX_SERVER=$EDUX_SERVER 2>&1 | tee -a ci-ios.log
          dart run tool/configure_platforms.dart --ios 2>&1 | tee -a ci-ios.log
          (cd ios && pod install --repo-update) 2>&1 | tee -a ci-ios.log

      - name: iOS (imzosiz)
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }} --dart-define=EDUX_SERVER=$EDUX_SERVER 2>&1 | tee build-ios.log

      - name: .app arxivi
        run: |
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Runner.app "$GITHUB_WORKSPACE/edux-ios-unsigned.app.zip"

      - name: Xato tafsilotlari
        if: failure()
        run: |
          for file in ci-ios.log build-ios.log; do
            [ -f "$file" ] || continue
            grep -nE "(error|Error|ERROR|FAILED|Exception|CocoaPods|\.dart:[0-9]+:[0-9]+)" "$file" | grep -v "warning" | head -12 | while IFS= read -r line; do
              echo "::error title=iOS $file::$(echo "$line" | cut -c1-900)"
            done
          done

      - uses: actions/upload-artifact@v7
        with:
          name: edux-ios-unsigned
          path: edux-ios-unsigned.app.zip
          if-no-files-found: error
