# EduX mobil ilovasini yig'ish: tahlil, testlar, Android APK. main ga har push'dan keyin APK
# «Releases → latest» sahifasiga qo'yiladi — telefonga shu yerdan yuklab o'rnatiladi.
# iOS: alohida job (macos-latest) imzosiz `.app` yig'adi va Artifacts ga qo'yadi; u Android job'iga bog'liq emas
# va xato bersa ham Android yig'ilishi/Releases to'xtamaydi.
# Sozlamalar (repo → Settings → Secrets and variables → Actions):
#   vars.EDUX_SERVER             — ilova sukut bo'yicha ulanadigan server (masalan https://app.edux.uz)
#   secrets.GOOGLE_SERVICES_JSON — Firebase google-services.json matni (push uchun; bo'lmasa push o'chiq)
#   secrets.ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD — Play Market imzosi (ixtiyoriy)
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  EDUX_SERVER: ${{ vars.EDUX_SERVER || 'https://app.edux.uz' }}

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Platforma papkalari (android/ios)
        run: |
          set -o pipefail
          flutter --version
          flutter create --org uz.edux --project-name edux --platforms=android,ios . 2>&1 | tee -a ci.log
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then rm test/widget_test.dart; fi
          flutter pub get 2>&1 | tee -a ci.log
          dart run tool/configure_platforms.dart 2>&1 | tee -a ci.log
          dart run flutter_launcher_icons 2>&1 | tee -a ci.log

      - name: Firebase va imzo
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON yo'q — ilova push'siz yig'iladi"
          fi
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android/app/upload.jks
            printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          else
            echo "::notice::Imzo kaliti yo'q — APK sinov kaliti bilan imzolanadi"
          fi
          dart run tool/configure_firebase.dart 2>&1 | tee -a ci.log
          dart run tool/configure_signing.dart 2>&1 | tee -a ci.log

      - name: Tahlil
        run: |
          status=0
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1 || status=$?
          cat analyze.log
          # Xatolar annotatsiya bo'lib chiqadi (Actions sahifasida va API orqali ko'rinadi).
          grep -E "^\s*error •" analyze.log | head -40 | while IFS= read -r line; do
            file=$(echo "$line" | sed -E 's/.* • ([^ ]+):([0-9]+):([0-9]+) • .*/\1/'); row=$(echo "$line" | sed -E 's/.* • [^ ]+:([0-9]+):[0-9]+ • .*/\1/')
            echo "::error file=$file,line=$row::$line"
          done
          grep -E "^\s*warning •" analyze.log | head -20 | while IFS= read -r line; do echo "::warning::$line"; done
          echo "::notice::Tahlil: $(grep -cE '^\s*error •' analyze.log) xato, $(grep -cE '^\s*warning •' analyze.log) ogohlantirish, $(grep -cE '^\s*info •' analyze.log) maslahat"
          exit $status

      - name: Testlar
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log

      - name: APK
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} --dart-define=EDUX_SERVER=$EDUX_SERVER 2>&1 | tee build.log

      - name: AAB (Play Market)
        if: github.event_name == 'workflow_dispatch'
        run: flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=EDUX_SERVER=$EDUX_SERVER

      - name: Xato tafsilotlari
        if: failure()
        run: |
          for file in ci.log test.log build.log; do
            [ -f "$file" ] || continue
            grep -nE "(error|Error|ERROR|FAILED|Exception|What went wrong|Could not|Execution failed|\.dart:[0-9]+:[0-9]+)" "$file" | grep -v "^.*warning" | head -12 | while IFS= read -r line; do
              echo "::error title=$file::$(echo "$line" | cut -c1-900)"
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: edux-android
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Releases → latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/app/outputs/flutter-apk/*.apk \
            --prerelease --title "EduX $version (yig'ish ${{ github.run_number }})" \
            --notes "Avtomatik yig'ish: ${{ github.sha }}. Ko'pchilik telefonlar uchun: app-arm64-v8a-release.apk. Eski telefonlar: app-armeabi-v7a-release.apk. Server: $EDUX_SERVER"

  ios:
    # Imzosiz iOS yig'ish: loyiha sozlamalari, plaginlar (CocoaPods) va Dart kodi iOS da yig'ilishini tekshiradi.
    # App Store / TestFlight uchun imzo va GoogleService-Info.plist alohida (README → iPhone).
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Platforma papkasi (ios)
        run: |
          set -o pipefail
          flutter --version
          # flutter_launcher_icons android papkasini ham kutadi — shuning uchun ikkalasi yaratiladi.
          flutter create --org uz.edux --project-name edux --platforms=android,ios . 2>&1 | tee -a ci-ios.log
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then rm test/widget_test.dart; fi
          flutter pub get 2>&1 | tee -a ci-ios.log
          dart run tool/configure_platforms.dart --ios 2>&1 | tee -a ci-ios.log
          dart run flutter_launcher_icons 2>&1 | tee -a ci-ios.log

      - name: Xcode sozlamasi va CocoaPods
        run: |
          set -o pipefail
          # Podfile shu bosqichda yaratiladi — keyin minimal iOS versiyasi qayta qo'yiladi
          flutter build ios --config-only --release --no-codesign --dart-define=EDUX_SERVER=$EDUX_SERVER 2>&1 | tee -a ci-ios.log
          dart run tool/configure_platforms.dart --ios 2>&1 | tee -a ci-ios.log
          (cd ios && pod install --repo-update) 2>&1 | tee -a ci-ios.log

      - name: iOS (imzosiz)
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }} --dart-define=EDUX_SERVER=$EDUX_SERVER 2>&1 | tee build-ios.log

      - name: .app arxivi
        run: |
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Runner.app "$GITHUB_WORKSPACE/edux-ios-unsigned.app.zip"

      - name: Xato tafsilotlari
        if: failure()
        run: |
          for file in ci-ios.log build-ios.log; do
            [ -f "$file" ] || continue
            grep -nE "(error|Error|ERROR|FAILED|Exception|CocoaPods|\.dart:[0-9]+:[0-9]+)" "$file" | grep -v "warning" | head -12 | while IFS= read -r line; do
              echo "::error title=iOS $file::$(echo "$line" | cut -c1-900)"
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: edux-ios-unsigned
          path: edux-ios-unsigned.app.zip
          if-no-files-found: error
